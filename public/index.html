<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>noappmanager — Aufgaben</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">noappmanager</h1>

      <div class="row">
        <div class="col-md-6">
          <div class="card mb-3">
            <div class="card-body">
              <h5 class="card-title">Neue Aufgabe</h5>
              <form id="taskForm">
                <div class="mb-3">
                  <label for="title" class="form-label">Titel</label>
                  <input type="text" id="title" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label for="description" class="form-label">Beschreibung</label>
                  <textarea id="description" class="form-control" rows="3"></textarea>
                </div>
                <button class="btn btn-primary" type="submit">Hinzufügen</button>
              </form>
            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Aufgaben</h5>
              <ul id="tasksList" class="list-group list-group-flush"></ul>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Details</h5>
              <div id="taskDetails">Keine Aufgabe ausgewählt.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
